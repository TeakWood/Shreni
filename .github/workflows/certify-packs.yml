# Pack certification (ARD Stack-Packs §3.4, Shreni-beads-84m.4). For every
# in-tree pack with a reference/ fixture, run the FULL Silpi ↔ Viharapala ↔
# health-gate ↔ Parikshaka loop against the fixture backlog and assert merged
# beads + gates observed in the activity log + Parikshaka discovery. A pack may
# not claim "certified" without this passing — supported is a tested claim (G3).
#
# Runs real agents, so it needs ANTHROPIC_API_KEY and is NOT a per-PR gate:
# trigger manually or on the weekly schedule. One job per pack, ~10 min cap.
name: certify-packs

on:
  workflow_dispatch:
    inputs:
      pack:
        description: 'Certify a single pack (wins over change detection). Blank = only packs changed since <base>.'
        required: false
        default: ''
      base:
        description: 'Git ref to diff against for changed-pack detection (blank = HEAD~1). Use "all" to force every pack.'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC — full sweep, catches external drift

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history so the change-detection diff can resolve <base>
      - id: list
        env:
          PACK_INPUT: ${{ github.event.inputs.pack }}
          BASE_INPUT: ${{ github.event.inputs.base }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Certifiable packs = those carrying a reference/ fixture.
          all_packs() { ls -d packs/*/reference 2>/dev/null | cut -d/ -f2 | sort -u; }

          if [ -n "$PACK_INPUT" ]; then
            # Explicit single pack wins over any detection.
            sel="$PACK_INPUT"
          elif [ "$EVENT" = "schedule" ] || [ "$BASE_INPUT" = "all" ]; then
            # Weekly (and opt-in --all) run the full sweep to catch external drift
            # — dependency/CLI-version rot that no pack edit would reveal.
            sel="$(all_packs)"
          else
            # Scope to packs whose own files changed since <base> (default HEAD~1),
            # intersected with certifiable packs. New packs with a reference/ show
            # up here too. Empty result → the certify job is skipped entirely.
            base="${BASE_INPUT:-HEAD~1}"
            changed="$(git diff --name-only "$base"...HEAD -- 'packs/**' | cut -d/ -f2 | sort -u)"
            sel="$(comm -12 <(all_packs) <(printf '%s\n' "$changed" | sort -u))"
          fi

          # Build the JSON matrix. The `|| packs='[]'` keeps an empty selection
          # from tripping `set -e` (grep exits non-zero when nothing matches).
          packs=$(printf '%s\n' $sel | grep -v '^[[:space:]]*$' | jq -R . | jq -cs .) || packs='[]'
          [ -z "$packs" ] && packs='[]'
          echo "packs=$packs" >> "$GITHUB_OUTPUT"
          echo "certifying: $packs"

  certify:
    needs: discover
    if: needs.discover.outputs.packs != '[]'
    runs-on: ubuntu-latest
    # Real agent latency on hosted runners is ~4-5 min/bead; a 3-bead fixture
    # backlog + setup needs headroom past the old 15. Kept bounded so a hung
    # run still fails fast-ish. See Shreni-beads-84m.13 for fixture right-sizing.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.discover.outputs.packs) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The cert script's internal backlog cap (default 9 min) is too tight for a
      # full 3-bead loop on hosted runners; give it room within the job timeout.
      SHRENI_CERT_TIMEOUT_MS: '780000' # 13 min
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install bd + claude CLIs
        # @beads/bd's postinstall SKIPS the release-binary download when CI is
        # set (GitHub Actions sets CI=true), so a plain `npm i -g` leaves the
        # wrapper without its binary and `bd init` aborts with "bd binary not
        # found". Clear CI for the bd install so the postinstall downloads it,
        # then assert bd is on PATH so a silent miss fails here, not mid-cert.
        run: |
          npm install -g @anthropic-ai/claude-code
          CI= npm install -g @beads/bd
          bd version
      # Per-ecosystem toolchains the fixtures need: uv for python-fastapi
      # (backlog.sh runs `uv sync`); Go ships on ubuntu-latest already.
      - uses: astral-sh/setup-uv@v5
      - name: Git identity for fixture commits
        run: |
          git config --global user.name "shreni-cert"
          git config --global user.email "cert@shreni.invalid"
      - name: Certify ${{ matrix.pack }}
        run: pnpm certify ${{ matrix.pack }}
