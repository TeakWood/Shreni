# Tier 2 — full end-to-end smoke against a REAL provider.
#
# The top of the E2E test ladder. The lower tiers (ci.yml) gate
# every push/PR: the mocked unit suite and the integration tier, which STUB
# the LLM turn. This tier stubs nothing — it drives one genuine Silpi ↔ Viharapala
# pass against a live provider on a throwaway Kshetra with a single trivial task
# and asserts a real squash-merge to main. It is the only rung that catches drift
# in the provider-CLI envelope, which no mock re-checks.
#
# Nondeterministic and token-costing, so it is NOT a per-PR gate: nightly on a
# schedule + manual dispatch, gated on ANTHROPIC_API_KEY. This is a standalone
# workflow on no branch's required-checks list, so a red run ALERTS (a failed
# nightly on the default branch) without blocking any merge. Absent the secret
# (forks, secretless dispatch) the harness skips clean with exit 0 → green.
name: e2e-nightly

on:
  schedule:
    - cron: '0 5 * * *' # nightly, 05:00 UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # One trivial task is ~6-7 min of real agent latency on a hosted runner; the
    # harness's own SHRENI_E2E_TIMEOUT_MS (12 min) caps a hung provider call, and
    # this job timeout is the outer backstop so nothing bills indefinitely.
    timeout-minutes: 20
    # The task graph's database: init sets the throwaway Kshetra up on it, the
    # harness files its task into it, and the worker claims from it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shreni
          POSTGRES_PASSWORD: shreni
          POSTGRES_DB: shreni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shreni -d shreni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SHRENI_DATABASE_URL: postgres://shreni:shreni@localhost:5432/shreni
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the claude CLI
        # The provider the smoke drives.
        run: npm install -g @anthropic-ai/claude-code
      - name: Git identity for fixture commits
        run: |
          git config --global user.name "shreni-e2e"
          git config --global user.email "e2e@shreni.invalid"
      - name: Run Tier 2 full e2e
        # Skips clean (exit 0) if ANTHROPIC_API_KEY is unset — e.g. a dispatch from
        # a fork with no access to the secret — so the job is green-when-unconfigured.
        run: pnpm e2e:full
