# E2E/integration test ladder, Tiers 0 and 1.
#
# Tier 0 (`test` job): the cheapest gate. Runs the existing unit suite —
# plus typecheck and build — on every push and PR. Until now the suite only ran
# in release-binaries.yml (release time), so per-change regressions shipped
# green; this recovers value the tests already had but weren't delivering. No
# secrets, no external CLIs.
#
# Tier 1: the hermetic harness (src/sthapathi/e2e-hermetic.test.ts)
# drives claim → branch → squash-merge → finish against REAL git in throwaway
# tmp repos and the real task graph engine (PGlite) — only the LLM turn is
# stubbed. It needs no external binary beyond git, so it runs in the `test` job
# with the rest of the unit suite; the engine's real-Postgres tier is the
# `engine-integration` job. Deterministic and secret-free (the real-provider
# Tier 2 is a separate, API-key-gated workflow).
name: ci

on:
  push:
  pull_request:

# Newer pushes to the same branch/PR supersede in-flight runs — don't burn
# minutes finishing a run whose commit is already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  # The task graph engine's concurrency tier (engine spec, "Testing"): real
  # Postgres through Testcontainers (Docker is on ubuntu-latest), covering
  # SKIP LOCKED contention, fencing, sibling completions, retried claims,
  # session locks, event order and the races the PGlite unit tier can't reach.
  engine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pg_dump and pg_restore at least as new as the test server (postgres:17),
      # for the backups test; the runner's own client is older.
      - name: Install the Postgres 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # pg_wrapper picks the runner's own 16 cluster for pg_dump; put 17's tools first.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: pnpm test:integration

  # Phalaka web E2E (Shreni-beads-zy9.1). Real-browser regression guard for the
  # dashboard. The web app is a STANDALONE package (src/phalaka/web) with its own
  # lockfile — deliberately off the root dep tree + SEA binary — so it installs
  # separately here, not via the root `pnpm install`. Tests are hermetic: the
  # backend + SSE stream are mocked in-browser (e2e/fixtures/mock-backend.ts), so
  # no live Phalaka server, database, or agents run. Chromium only.
  phalaka-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/phalaka/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/phalaka/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        run: pnpm test:e2e
